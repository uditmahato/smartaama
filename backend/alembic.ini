# backend/alembic.ini
#
# Alembic configuration for SmartAama. Run every command from backend/:
#
#     alembic upgrade head                       # bring the DB at DATABASE_URL to the latest revision
#     alembic current / alembic history          # inspect
#     alembic check                              # fail if the models and the DB schema differ
#     alembic revision --autogenerate -m "..." --rev-id 000N_slug
#
# The database URL is NOT stored here: alembic/env.py reads app.core.config.settings.DATABASE_URL
# (i.e. the DATABASE_URL environment variable / backend/.env). SECRET_KEY must also be set because
# importing the settings validates it.

[alembic]
# %(here)s = the directory containing this file (backend/), so the CLI works from any CWD.
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
# Migration files are named after the revision id; always pass --rev-id 000N_slug so the chain
# stays readable (0001_baseline -> 0002_facilities -> ...).
file_template = %%(rev)s

# Logging configuration -------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
