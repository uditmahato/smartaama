name: Release

# Cut a release by bumping VERSION + CHANGELOG.md on main, then pushing a matching tag:
#   git tag -a v0.1.0 -m "SmartAama 0.1.0" && git push origin v0.1.0
# The workflow verifies the tag matches VERSION, runs the backend tests and the frontend
# build, packages the archives (scripts/package_release.py) and publishes a GitHub Release
# with the CHANGELOG section for that version as release notes.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, test, package and publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SECRET_KEY: release-only-secret-key-that-is-at-least-32-characters-long
      DATABASE_URL: sqlite:///./release_check.db
      ENV: dev
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match VERSION
        run: |
          test "v$(tr -d '[:space:]' < VERSION)" = "${GITHUB_REF_NAME}" \
            || { echo "Tag ${GITHUB_REF_NAME} does not match VERSION ($(cat VERSION))"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend tests (SQLite) and migration parity
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pytest -q
          alembic upgrade head
          alembic check

      - name: Frontend typecheck and production build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Package release archives
        run: python scripts/package_release.py --check-tag "${GITHUB_REF_NAME}" --out dist-release

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]") > 0) { found=1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for $VERSION; using a generic note." >&2
            echo "SmartAama $VERSION. See CHANGELOG.md for details." > release-notes.md
          fi
          {
            echo
            echo "### Assets"
            echo '- `smartaama-backend-<version>.tar.gz` — backend source (deploy with a Python 3.11+ venv + PostgreSQL; run `python -m app.db.init_db`)'
            echo '- `smartaama-frontend-<version>.tar.gz` — production build of the React app (serve as static files; set `VITE_API_BASE_URL` at build time if your API is not at `http://localhost:8000/api/v1`)'
            echo '- `smartaama-<version>-full.zip` — both + documentation'
            echo '- `SHA256SUMS` — checksums of the archives'
          } >> release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "SmartAama ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag \
            dist-release/*

      - name: Upload archives as workflow artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: smartaama-${{ github.ref_name }}
          path: dist-release/
          retention-days: 30
