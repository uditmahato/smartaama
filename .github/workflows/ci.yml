name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smartaama
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: smartaama_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartaama"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-only-secret-key-that-is-at-least-32-characters-long
      DATABASE_URL: sqlite:///./ci_import.db
      ENV: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Import / startup check (no uploads dir present)
        run: python -c "import app.main; print('import ok')"
      - name: Tests (SQLite)
        run: python -m pytest -q
      - name: Tests (PostgreSQL 16)
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://smartaama:ci-only-password@localhost:5432/smartaama_test
        run: python -m pytest -q
      - name: Fresh database initialisation + migration parity (PostgreSQL)
        env:
          DATABASE_URL: postgresql+psycopg2://smartaama:ci-only-password@localhost:5432/smartaama_test
        run: |
          python - <<'EOF'
          import sqlalchemy as sa, os
          eng = sa.create_engine(os.environ["DATABASE_URL"])
          with eng.begin() as c:
              c.execute(sa.text("DROP SCHEMA public CASCADE; CREATE SCHEMA public;"))
          EOF
          python -m app.db.init_db
          python -m app.db.init_db   # idempotent second run
          alembic current
          alembic check              # models and migrations must agree
      - name: Migrations on SQLite (portability)
        env:
          DATABASE_URL: sqlite:///./ci_migrations.db
        run: |
          alembic upgrade head
          alembic check

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install frontend + browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: frontend
        env:
          E2E_PYTHON: python
          CI: "true"
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
